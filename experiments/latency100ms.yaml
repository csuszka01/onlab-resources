apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: openfaas-latency-100
  namespace: chaos-mesh
spec:
  action: delay
  mode: all
  selector:
    labelSelectors:
      'faas_function': 'figlet'
    namespaces:
      - openfaas-fn
  delay:
    latency: '100ms'
    correlation: '0'
    jitter: '1ms'
  duration: '2m'
