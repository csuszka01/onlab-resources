apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-test
  namespace: chaos-mesh
spec:
  mode: all
  selector:
    namespaces:
      - openfaas-fn
    labelSelectors:
      'faas_function': 'figlet'
  stressors:
    cpu:
      workers: 10    # cpu cores
      load: 50     # cpu load
  duration: '1m'
